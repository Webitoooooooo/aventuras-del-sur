{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Categorías del Parque</h4>
    <a href="{% url 'crear_categoria' %}" class="btn btn-success">+ Nueva Categoría</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <table class="table table-striped tabla-datos">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for cat in categorias %}
                <tr>
                    <td>{{ cat.nombre }}</td>
                    <td>{{ cat.descripcion }}</td>
                    <td>
                        {% if cat.activa %}
                            <span class="badge bg-success">Activa</span>
                        {% else %}
                            <span class="badge bg-danger">Inactiva</span>
                        {% endif %}
                    </td>
                    <td>
                        <a href="{% url 'editar_categoria' cat.pk %}" class="btn btn-sm btn-warning">Editar</a>
                        <a href="{% url 'eliminar_categoria' cat.pk %}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar categoría?')">Eliminar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
